<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Preferans M3 test client</title>
<style>
  body { font-family: monospace; margin: 1em; }
  #seat { font-weight: bold; font-size: 1.2em; }
  textarea { width: 100%; height: 60px; }
  pre { background: #f0f0f0; padding: 1em; max-height: 400px; overflow: auto; }
  button { margin-top: 0.5em; }
  .examples { color: #555; font-size: 0.9em; }
</style>
</head>
<body>
  <div id="seat">Seat: ?</div>
  <div>
    <textarea id="action">{"type":"bid","player":0,"value":2}</textarea>
    <br>
    <button onclick="sendAction()">Send action</button>
  </div>
  <p class="examples">
    Primeri: {"type":"bid","player":0,"value":2} &middot;
    {"type":"pass","player":1} &middot;
    {"type":"sayIgra","player":0}
  </p>
  <h3>State (live):</h3>
  <pre id="state">(waiting for connection...)</pre>
  <h3>Log:</h3>
  <pre id="log"></pre>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const seat = params.get('seat') || '0';
    document.getElementById('seat').textContent = 'Seat: ' + seat;

    const log = (msg) => {
      const el = document.getElementById('log');
      el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
    };

    const socket = io('/', { query: { seat } });

    socket.on('connect', () => log('connected as seat ' + seat));
    socket.on('game:state', (state) => {
      document.getElementById('state').textContent = JSON.stringify(state, null, 2);
      log('state updated, phase=' + state.phase);
    });
    socket.on('game:action-rejected', (action) => log('REJECTED: ' + JSON.stringify(action)));
    socket.on('game:error', (msg) => log('ERROR: ' + msg));
    socket.on('disconnect', () => log('disconnected'));

    function sendAction() {
      try {
        const action = JSON.parse(document.getElementById('action').value);
        socket.emit('game:action', action);
        log('sent: ' + JSON.stringify(action));
      } catch (e) {
        log('invalid JSON: ' + e.message);
      }
    }
  </script>
</body>
</html>
