<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2ecdb"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 100 100)">
    <rect x="34" y="14" width="132" height="182" rx="14" fill="url(#card)" stroke="#1a1a1a" stroke-width="3"/>
    <!-- gornji levi indeks -->
    <text x="48" y="52" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#1a1a1a">A</text>
    <text x="50" y="76" font-size="22" fill="#1a1a1a">♣</text>
    <!-- donji desni indeks (naopako, kao prava karta) -->
    <g transform="rotate(180 152 158)">
      <text x="138" y="52" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#1a1a1a">A</text>
      <text x="140" y="76" font-size="22" fill="#1a1a1a">♣</text>
    </g>
    <!-- veliki tref u sredini -->
    <text x="100" y="140" font-size="108" text-anchor="middle" fill="#1a1a1a">♣</text>
  </g>
</svg>
