<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Moje partije — Preferans</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at center, #1e3320 0%, #10201a 60%, #0a0b0c 100%);
    color: #eef2ef;
    padding: 24px;
  }
  h1 { font-size: 1.4em; margin-bottom: 4px; }
  .sub { color: #9fb3a7; font-size: 0.9em; margin-bottom: 24px; }
  .card {
    background: linear-gradient(180deg, #1c2b23 0%, #16211c 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 24px;
    max-width: 1100px;
  }
  .card h2 { font-size: 1.1em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #9fb3a7; font-weight: 600; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  button {
    background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 100%);
    border: 1px solid rgba(255,255,255,0.2);
    color: white; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.85em;
  }
  button:hover { background: rgba(255,255,255,0.2); }
  input[type="text"], input[type="password"] {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: white; border-radius: 6px; padding: 8px; width: 100%;
    margin-bottom: 10px;
  }
  #loginBox { max-width: 360px; }
  .err { color: #ff8a80; font-size: 0.85em; margin-top: 6px; }
  .muted { color: #9fb3a7; font-size: 0.85em; }
  .clickable { cursor: pointer; color: #d4a94f; text-decoration: underline dotted; }
  .clickable:hover { color: #f0c870; }
  .back-link { color: #9fb3a7; font-size: 0.85em; text-decoration: none; }
  .back-link:hover { color: white; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: linear-gradient(180deg, #1c2b23 0%, #16211c 100%);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 24px; max-width: 1100px; width: 100%; max-height: 90vh; overflow: auto;
  }
  .modal h2 { margin-top: 0; }
  .modal .close { float: right; cursor: pointer; font-size: 1.2em; color: #9fb3a7; }
  .modal .close:hover { color: white; }
  .hand-block {
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
  }
  .hand-block h3 { margin: 0 0 8px; font-size: 0.95em; color: #d4a94f; }
  .hand-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85em; color: #9fb3a7; margin-bottom: 8px; }
  .trick-row { display: flex; gap: 8px; align-items: center; font-size: 0.85em; padding: 3px 0; }
  .trick-num { color: #9fb3a7; width: 28px; }
  .seat-label { width: 60px; color: #d4a94f; font-weight: 600; }
  .card-pill {
    display: inline-block; padding: 2px 8px; border-radius: 4px; margin-right: 4px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  }
  .win { color: #8be78b; font-weight: 600; }
  .lose { color: #ff8a80; }
</style>
</head>
<body>

<div id="loginBox" class="card">
  <h2>Prijava</h2>
  <input type="text" id="email" placeholder="email">
  <input type="password" id="password" placeholder="lozinka">
  <button onclick="doLogin()">Uloguj se</button>
  <div class="err" id="loginErr"></div>
  <a class="back-link" href="/preferans.html">← nazad na igru</a>
</div>

<div id="matchesBox" style="display:none">
  <h1>🃏 Moje partije</h1>
  <div class="sub" id="whoami"></div>

  <div class="card">
    <h2><span>Istorija partija</span><button onclick="loadMatches()">🔄 Osveži</button></h2>
    <table>
      <thead><tr><th>ID</th><th>Soba</th><th>Kraj</th><th>Razlog</th><th>Rundi</th><th>Protivnici</th><th>Moja bule</th><th>Rejting Δ</th><th>Detalji</th></tr></thead>
      <tbody id="matchesBody"></tbody>
    </table>
    <div class="muted" id="matchesEmpty" style="display:none;margin-top:8px">Još nema završenih partija.</div>
  </div>
  <a class="back-link" href="/preferans.html">← nazad na igru</a>
</div>

<div class="modal-bg" id="matchModal" onclick="if(event.target===this)closeMatchModal()">
  <div class="modal">
    <span class="close" onclick="closeMatchModal()">✕</span>
    <div id="matchDetail"></div>
  </div>
</div>

<script>
  let token = null;
  let myUserId = null;
  try { token = localStorage.getItem('pref_token'); } catch (e) {}

  // Security fix (2026-09-17, kodni pregled): imena igraca su korisnicki
  // unos (bez sanitizacije pri registraciji, vidi auth/routes.ts) — ova
  // stranica ih ubacuje u innerHTML, pa MORAJU biti escape-ovana isto kao
  // svuda drugde u projektu (app.js escapeHtml) da spreci stored XSS
  // (zlonamerno ime tipa "<img src=x onerror=...>" bi se izvrsilo u
  // browseru svakog ko otvori tu partiju).
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function doLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    document.getElementById('loginErr').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!data.token) throw new Error(data.error || 'Greška');
      token = data.token;
      try { localStorage.setItem('pref_token', token); } catch (e) {}
      await tryEnter();
    } catch (e) {
      document.getElementById('loginErr').textContent = e.message;
    }
  }

  async function tryEnter() {
    try {
      const me = await api('/api/me');
      if (!me.user) throw new Error('Nije prijavljen');
      myUserId = me.user.id;
      await loadMatches();
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('matchesBox').style.display = 'block';
      document.getElementById('whoami').textContent = 'Prijavljen kao: ' + (me.user.name || me.user.email);
    } catch (e) {
      document.getElementById('loginErr').textContent = 'Nisi prijavljen (' + e.message + ').';
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('matchesBox').style.display = 'none';
    }
  }

  // Pronadji moje sediste u partiji (0/1/2) na osnovu user_id
  function mySeat(m) {
    if (m.player0_user_id === myUserId) return 0;
    if (m.player1_user_id === myUserId) return 1;
    if (m.player2_user_id === myUserId) return 2;
    return -1;
  }

  function opponentNames(m, mySeat) {
    const names = [m.player0_name, m.player1_name, m.player2_name];
    return [0, 1, 2].filter((i) => i !== mySeat).map((i) => names[i] || '?').join(' / ');
  }

  async function loadMatches() {
    try {
      const { matches } = await api('/api/matches?limit=200');
      const body = document.getElementById('matchesBody');
      body.innerHTML = '';
      document.getElementById('matchesEmpty').style.display = matches.length === 0 ? 'block' : 'none';
      for (const m of matches) {
        const seat = mySeat(m);
        if (seat < 0) continue;
        const bulas = JSON.parse(m.final_bulas);
        const deltas = JSON.parse(m.rating_deltas);
        const reasonLabel = { natural: 'prirodan', agreed: 'dogovor', leave: 'napustio' }[m.match_end_reason] || m.match_end_reason;
        const deltaClass = deltas[seat] > 0 ? 'win' : (deltas[seat] < 0 ? 'lose' : '');

        const tr = document.createElement('tr');
        const cells = [
          String(m.id),
          m.room_code,
          new Date(m.ended_at + 'Z').toLocaleString('sr-RS'),
          reasonLabel,
          String(m.rounds_played),
          opponentNames(m, seat),
          String(bulas[seat]),
          (deltas[seat] >= 0 ? '+' : '') + deltas[seat],
        ];
        for (let i = 0; i < cells.length; i++) {
          const td = document.createElement('td');
          td.textContent = cells[i];
          if (i === 7) td.className = deltaClass;
          tr.appendChild(td);
        }
        const tdAction = document.createElement('td');
        const btn = document.createElement('span');
        btn.className = 'clickable';
        btn.textContent = '📋';
        btn.onclick = () => openMatchModal(m.id);
        tdAction.appendChild(btn);
        tr.appendChild(tdAction);

        body.appendChild(tr);
      }
    } catch (e) {
      console.error('loadMatches:', e);
    }
  }

  async function openMatchModal(id) {
    try {
      const { match } = await api('/api/matches/' + id);
      renderMatchDetail(match);
      document.getElementById('matchModal').classList.add('open');
    } catch (e) {
      alert('Greška: ' + e.message);
    }
  }

  function closeMatchModal() {
    document.getElementById('matchModal').classList.remove('open');
  }

  const SEAT_LABELS = ['Jug', 'Istok', 'Zapad'];
  const FOLLOW_LABELS = { DODJEM: 'DODJEM', NE_DODJEM: 'NE DODJEM' };
  const KONTRA_LABELS = { KONTRA: '×2', REKONTRA: '×4', SUBKONTRA: '×8', MORTKONTRA: '×16' };

  function renderMatchDetail(m) {
    // Security fix: imena su korisnicki unos, escape-uj PRE bilo kakve
    // upotrebe u html.push(...) nizu ispod (sve ide u innerHTML).
    const seatNames = [m.player0_name || '?', m.player1_name || '?', m.player2_name || '?'].map(escapeHtml);
    // Korisnikov zahtev: "u moje partije se pominju istok, zapad i jug iako
    // su igrala 3 druga igraca" — kompasna pozicija sama nista ne znaci
    // citaocu, mora uz nju ime. seatLabel() daje oboje svuda umesto samo
    // SEAT_LABELS na nekim mestima (followInfo/callerInfo/tricks su ranije
    // pokazivali GOLU poziciju bez imena).
    const seatLabel = (p) => SEAT_LABELS[p] + ' (' + seatNames[p] + ')';
    const mySeat = (function () {
      if (m.player0_user_id === myUserId) return 0;
      if (m.player1_user_id === myUserId) return 1;
      if (m.player2_user_id === myUserId) return 2;
      return 0;
    })();
    const bulas = JSON.parse(m.final_bulas);
    const scores = JSON.parse(m.final_scores);
    const deltas = JSON.parse(m.rating_deltas);
    const newRatings = JSON.parse(m.new_ratings);
    const hands = JSON.parse(m.hands_json || '[]');
    // Bag (kodni pregled 2026-09-17): Math.max je birao GUBITNIKA — ceo
    // projekat (engine calculateMatchScores, klijent renderResult) je
    // uskladjen da NIZI score pobedjuje (bula*10 + duguje - potrazuje,
    // potvrdjeno korisnikovim primerom 2026-09-04).
    const winnerIdx = scores.indexOf(Math.min(...scores));
    const iWon = winnerIdx === mySeat;
    const reasonLabel = { natural: 'prirodan kraj', agreed: 'dogovor igrača', leave: 'napuštanje' }[m.match_end_reason] || m.match_end_reason;

    const html = [];
    html.push('<h2>Partija #' + m.id + ' — ' + escapeHtml(m.room_code) + ' ' + (iWon ? '🏆' : '') + '</h2>');
    html.push('<div class="hand-meta">');
    html.push('<span>Završena: ' + new Date(m.ended_at + 'Z').toLocaleString('sr-RS') + '</span>');
    html.push('<span>Razlog: ' + reasonLabel + '</span>');
    html.push('<span>Rundi: ' + m.rounds_played + '</span>');
    html.push('</div>');

    html.push('<h3>Finalni rezultat</h3>');
    html.push('<table style="margin-bottom:16px"><thead><tr><th></th><th>Jug</th><th>Istok</th><th>Zapad</th></tr></thead><tbody>');
    html.push('<tr><td><b>Ime</b></td><td>' + seatNames[0] + (mySeat === 0 ? ' (ti)' : '') + '</td><td>' + seatNames[1] + (mySeat === 1 ? ' (ti)' : '') + '</td><td>' + seatNames[2] + (mySeat === 2 ? ' (ti)' : '') + '</td></tr>');
    html.push('<tr><td><b>Bule</b></td><td>' + bulas[0] + '</td><td>' + bulas[1] + '</td><td>' + bulas[2] + '</td></tr>');
    html.push('<tr><td><b>Skor</b></td><td>' + scores[0] + '</td><td>' + scores[1] + '</td><td>' + scores[2] + '</td></tr>');
    html.push('<tr><td><b>Δ rejting</b></td><td class="' + (deltas[0] > 0 ? 'win' : deltas[0] < 0 ? 'lose' : '') + '">' + (deltas[0] >= 0 ? '+' : '') + deltas[0] + '</td><td class="' + (deltas[1] > 0 ? 'win' : deltas[1] < 0 ? 'lose' : '') + '">' + (deltas[1] >= 0 ? '+' : '') + deltas[1] + '</td><td class="' + (deltas[2] > 0 ? 'win' : deltas[2] < 0 ? 'lose' : '') + '">' + (deltas[2] >= 0 ? '+' : '') + deltas[2] + '</td></tr>');
    html.push('<tr><td><b>Novi rejting</b></td><td>' + newRatings[0] + '</td><td>' + newRatings[1] + '</td><td>' + newRatings[2] + '</td></tr>');
    html.push('</tbody></table>');

    if (hands.length === 0) {
      html.push('<div class="muted">Nema detalja po rundama.</div>');
    } else {
      html.push('<h3>Runde (' + hands.length + ')</h3>');
      hands.forEach((h, i) => {
        const passedLabel = h.passed ? '✅ prošao' : '❌ pao';
        const kontraLabel = h.kontraLevel ? (' × ' + (KONTRA_LABELS[h.kontraLevel] || h.kontraLevel)) : '';
        const followInfo = h.followChoices.map((fc, idx) => {
          if (fc === null) return null;
          return seatLabel(idx) + ': ' + (FOLLOW_LABELS[fc] || fc);
        }).filter(Boolean).join(', ') || '—';
        const callerInfo = h.caller !== null && h.callee !== null
          ? seatLabel(h.caller) + ' zvao ' + seatLabel(h.callee)
          : (h.caller !== null ? seatLabel(h.caller) + ' zvao (niko)' : '—');

        html.push('<div class="hand-block">');
        html.push('<h3>Runda ' + (i + 1) + ' — ' + (h.declaredGame || '?') + kontraLabel + '</h3>');
        html.push('<div class="hand-meta">');
        html.push('<span>Nosilac: ' + seatLabel(h.declarer) + '</span>');
        html.push('<span>Pratioci: ' + followInfo + '</span>');
        html.push('<span>Poziv: ' + callerInfo + '</span>');
        html.push('<span>Završnica: ' + passedLabel + '</span>');
        html.push('<span>Bule posle: ' + h.bulasAfter.join(' / ') + '</span>');
        html.push('<span>Supe Δ: ' + h.supeDelta.join(' / ') + '</span>');
        html.push('</div>');
        html.push('<div class="hand-meta">Štihovi: ' + [0, 1, 2].map(p => seatLabel(p) + ': ' + h.tricksWon[p]).join(', ') + '</div>');

        if (h.talon && h.talon.length > 0) {
          html.push('<div class="hand-meta">Talon: ');
          h.talon.forEach((c) => {
            html.push('<span class="card-pill">' + c.rank + c.suit + '</span>');
          });
          html.push('</div>');
        }

        if (h.tricks && h.tricks.length > 0) {
          html.push('<div style="margin-top:8px"><b>Štihovi:</b></div>');
          h.tricks.forEach((trick, ti) => {
            html.push('<div class="trick-row"><span class="trick-num">' + (ti + 1) + '.</span>');
            trick.forEach((tc) => {
              const isMine = tc.position === mySeat;
              html.push('<span class="seat-label" style="' + (isMine ? 'color:#8be78b' : '') + '">' + seatLabel(tc.position) + ':</span>');
              html.push('<span class="card-pill">' + tc.rank + tc.suit + '</span>');
            });
            html.push('</div>');
          });
        }
        html.push('</div>');
      });
    }

    document.getElementById('matchDetail').innerHTML = html.join('');
  }

  if (token) tryEnter();
</script>
</body>
</html>
